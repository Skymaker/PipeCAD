<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181c">
<title>PipeCAD RA</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel-2:#f7f8fa; --border:#d8dce2; --text:#1c2128; --muted:#66707c;
  --accent:#2f6fde; --accent-soft:#e3ecfb; --accent-text:#ffffff; --hover:#eef1f5; --viewport:#e8ecf1;
  --ok:#2b8a53; --warn:#c77d00; --err:#d4373c;
  --c20:#4f9fd6; --c32:#8e99a5; --c40:#d4954a; --fitting:#d9dde2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1d2127; --panel-2:#22272e; --border:#323840; --text:#e2e6eb; --muted:#8b95a1;
    --accent:#5b8ff0; --accent-soft:#24324a; --hover:#2a3038; --viewport:#20252b;
    --ok:#4cbf7d; --warn:#e8a33a; --err:#f0616a;
    --c20:#5aaee6; --c32:#a3aeba; --c40:#e2a660; --fitting:#c9ced5;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--viewport);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block}
button,a.btn{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.12);backdrop-filter:blur(6px)}
#top{position:fixed;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#top > *{pointer-events:auto}
#title{padding:8px 12px;min-width:0;flex:1}
#title b{font-size:15px}
#title .brand span{color:var(--accent)}
#name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px}
#info{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 64px);padding:10px 12px;font-size:13px;width:250px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
#info dt{color:var(--muted)}
#info dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
#ar{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
#ar b{color:var(--text)}
#bar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
#msg{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px);padding:8px 14px;font-size:13px;max-width:calc(100% - 24px);text-align:center}
#msg.err{border-color:var(--err);color:var(--err)}
#start{position:fixed;inset:0;display:grid;place-items:center;padding:16px}
#start .card{padding:20px;max-width:420px;width:100%}
#start h1{font-size:20px;margin:0 0 6px}
#start p{margin:6px 0 14px;color:var(--muted)}
#start .btns{display:grid;gap:8px}
/* Realidad aumentada: interfaz superpuesta (Android, dom-overlay); en las gafas no se ve */
#xr-ui{position:fixed;inset:0;pointer-events:none;color:#fff;font-size:15px}
#xr-ui .card{background:rgba(20,23,28,.72);border-color:rgba(255,255,255,.18);color:#fff;pointer-events:auto}
#xr-msg{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);top:max(16px,env(safe-area-inset-top));padding:10px 14px;text-align:center}
#xr-btns{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px}
#xr-btns button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;min-height:48px}
#xr-btns button.primary{background:var(--accent);border-color:var(--accent)}
@media (max-width:700px){
  #info{left:max(12px,env(safe-area-inset-left));right:auto;width:auto;max-width:calc(100% - 24px);top:auto;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px)}
  #msg{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px)}
  #bar button{padding:8px 10px}
  .lbl{display:none}
}
</style>

<div id="view" aria-label="Vista 3D del proyecto"></div>

<div id="top">
  <div id="title" class="card"><b class="brand">Pipe<span>CAD</span> RA</b><span id="name">Sin proyecto</span></div>
  <button id="b-info" class="card" title="Mostrar u ocultar los datos del proyecto" aria-label="Datos del proyecto">ⓘ</button>

<div id="info" class="card" hidden>
  <dl id="facts"></dl>
  <div id="ar"></div>
</div>

<div id="bar" class="card" hidden>
  <button id="b-open" title="Abrir un proyecto .json">📂<span class="lbl">Abrir</span></button>
  <button id="b-home" title="Volver a la vista inicial">⌂<span class="lbl">Vista</span></button>
  <button id="b-grid" class="on" title="Mostrar u ocultar la rejilla del suelo">▦<span class="lbl">Rejilla</span></button>
  <button id="b-drop" title="Levantar la estructura 50 cm y soltarla (gravedad)" disabled>⤓<span class="lbl">Soltar</span></button>

    <div class="btns">
      <button id="s-last" class="primary" hidden>Último proyecto de PipeCAD</button>

<input id="file" type="file" accept=".json,application/json" hidden>

<div id="xr-ui" hidden>
  <div id="xr-msg" class="card">Busca el suelo con la cámara…</div>
  <div id="xr-btns" class="card">
    <button id="xr-place" class="primary">Colocar aquí</button>
    <button id="xr-replace" hidden>Recolocar</button>
    <button id="xr-exit">Salir</button>
  </div>
</div>

<script src="js/nucleo.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   VISOR DE REALIDAD AUMENTADA — fase R1: proyecto en metros, vista 3D adaptable y
   detección de lo que permite el dispositivo (WebXR en Quest 3 y Android, Quick Look en iOS).
   PipeCAD trabaja en mm con Z vertical; esta escena, como WebXR, en metros con Y vertical.
   ===================================================================== */
const hooks = {};
const N = globalThis.crearNucleoPipeCAD(THREE, hooks);
const { Model, analyze, DEFAULT_CONFIG, LIB, customGeometry, localToWorldQuat, loadModels, loadExampleJSON, store, fmt, esc, cssVar } = N;
const $ = s => document.querySelector(s);
const MM = 0.001;
const MOBILE = matchMedia('(pointer: coarse)').matches;
const SEG = MOBILE ? 20 : 32;                    // lados de los cilindros (menos en teléfonos)

// ---------------------------------------------------------------- mensajes
let msgTimer = 0;
function message(text, kind = '', ms = 4000) {
  const m = $('#msg'); m.textContent = text; m.className = 'card ' + kind; m.hidden = !text;
  clearTimeout(msgTimer); if (text && ms) msgTimer = setTimeout(() => { m.hidden = true; }, ms);
}

// ---------------------------------------------------------------- proyecto en el enlace (#p=…)
// El proyecto va comprimido (deflate) y en base64url dentro del fragmento: no se envía a ningún servidor.
const b64url = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64url = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function packProject(json) {
  const stream = new Blob([JSON.stringify(json)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  return b64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}
async function unpackProject(s) {
  const stream = new Blob([unb64url(s)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(stream).text());
}

// ---------------------------------------------------------------- escena (metros, Y vertical)
const view = $('#view');
const renderer = new THREE.WebGLRenderer({ antialias: !MOBILE || devicePixelRatio < 2, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 200);
camera.position.set(2.2, 1.6, 2.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0.3, 0); controls.maxPolarAngle = Math.PI * 0.495; // no se mete bajo el suelo
controls.addEventListener('change', requestRender);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa1a8, 1.5));
// Escenario: la estructura con su suelo, su rejilla y su luz. En la vista 3D está en el origen;
// en realidad aumentada se coloca sobre el suelo real (posición y giro alrededor de la vertical).
const stage = new THREE.Group(); scene.add(stage);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 4, 1.5); sun.castShadow = true;
sun.shadow.mapSize.setScalar(MOBILE ? 1024 : 2048);
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.01;
stage.add(sun, sun.target);

// Suelo: recoge las sombras (en RA, sobre el suelo real) y lleva una rejilla de 10 cm que se puede ocultar
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.28 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; stage.add(floor);
let grid = null;
function makeGrid(size) {
  if (grid) { stage.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  const n = Math.max(2, Math.ceil(size / 0.5) * 5); // divisiones de 10 cm
  grid = new THREE.GridHelper(n * 0.1, n, new THREE.Color(cssVar('--muted')), new THREE.Color(cssVar('--border')));
  grid.material.transparent = true; grid.material.opacity = 0.55; grid.position.y = 0.0005;
  grid.visible = $('#b-grid').classList.contains('on'); stage.add(grid);
}

// ---------------------------------------------------------------- montaje del proyecto
// Toda la estructura es una sola pieza (tubos encolados): mallas fusionadas por material para
// dibujarla rápido en gafas y teléfonos, y una lista de formas simples (cilindros y bolas) para la física.
const PVC_DENSITY = 1400;                               // kg/m³
const WALL = { 20: 1.5, 32: 2.4, 40: 3.0 };             // pared del tubo PVC presión (mm), para el peso
const assembly = new THREE.Group(); stage.add(assembly); // en metros, apoyado en el suelo (y = 0) y centrado
let current = null;                                     // { model, analysis, json, shapes, size, mass }
const mats = {};
function makeMaterials() {
  const std = c => new THREE.MeshStandardMaterial({ color: new THREE.Color(c), roughness: 0.55, metalness: 0.05 });
  for (const d of [20, 32, 40]) mats['tube' + d] = std(cssVar('--c' + d));
  mats.fitting = std(cssVar('--fitting')); mats.fitting.side = THREE.DoubleSide; // los STL pueden traer caras invertidas
}
makeMaterials();
const Y = new THREE.Vector3(0, 1, 0);
// Cilindro en mm entre dos distancias a lo largo de dir, como geometría sin índice y solo con posición y normal
function cylGeo(origin, dir, from, to, r) {
  const g = new THREE.CylinderGeometry(r, r, to - from, SEG, 1, false);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(Y, dir));
  g.translate(...origin.clone().addScaledVector(dir, (from + to) / 2).toArray());
  return clean(g);
}
function ballGeo(c, r) { const g = new THREE.SphereGeometry(r, SEG, Math.round(SEG / 2)); g.translate(c.x, c.y, c.z); return clean(g); }
function clean(g) { const n = g.index ? g.toNonIndexed() : g; for (const k of Object.keys(n.attributes)) if (k !== 'position' && k !== 'normal') n.deleteAttribute(k); if (!n.attributes.normal) n.computeVertexNormals(); return n; }

function buildAssembly() {
  for (const c of [...assembly.children]) { assembly.remove(c); c.geometry?.dispose(); }
  if (!current) return;
  const { model, analysis: an } = current, F = model.config.fittings;
  const byMat = { tube20: [], tube32: [], tube40: [], fitting: [] }, shapes = [];
  let mass = 0;
  // Tubos: del tope de una embocadura al de la otra (longitud real de corte)
  for (const s of an.segs.values()) {
    if (s.Le < 1e-6 || s.Lr <= 0) continue;
    const A = an.nodes.get(s.a).pos, r = s.d / 2;
    byMat['tube' + s.d]?.push(cylGeo(A, s.dir, s.zA, s.zA + s.Lr, r));
    const a = A.clone().addScaledVector(s.dir, s.zA), b = A.clone().addScaledVector(s.dir, s.zA + s.Lr);
    const t = WALL[s.d] ?? s.d * 0.075, m = PVC_DENSITY * Math.PI * (r * r - (r - t) * (r - t)) * s.Lr * 1e-9;
    shapes.push({ type: 'cyl', a, b, r, mass: m });
    mass += m;
  }
  // Accesorios
  for (const n of an.nodes.values()) {
    if (['end', 'invalid', 'isolated'].includes(n.kind)) continue;
    const ports = [...n.ports, ...n.open], first = shapes.length;
    let rMax = 0, vol = 0;
    if (n.kind === 'custom') {
      const g = clean(customGeometry(n).clone());
      g.applyQuaternion(localToWorldQuat(ports.filter(p => p.local).map(p => ({ local: p.local, world: p.dir }))));
      g.translate(n.pos.x, n.pos.y, n.pos.z);
      byMat.fitting.push(g);
    }
    for (const p of ports) {
      const R = (F[p.d]?.od ?? n.od ?? p.d * 1.3) / 2; rMax = Math.max(rMax, R);
      if (n.kind !== 'custom') {
        if (p.z > 0) byMat.fitting.push(cylGeo(n.pos, p.dir, 0, p.z, R * 0.94));
        byMat.fitting.push(cylGeo(n.pos, p.dir, p.z, p.z + p.socket, R));
      }
      shapes.push({ type: 'cyl', a: n.pos.clone(), b: n.pos.clone().addScaledVector(p.dir, p.z + p.socket), r: R });
      vol += Math.PI * (R * R - (p.d / 2) ** 2) * p.socket + Math.PI * (R * 0.94) ** 2 * p.z * 0.35; // embocadura hueca + cuerpo
    }
    const branched = ports.some(a => ports.some(b => Math.abs(a.dir.dot(b.dir)) < 1 - 1e-6));
    if (branched) { if (n.kind !== 'custom') byMat.fitting.push(ballGeo(n.pos, rMax * 0.94)); shapes.push({ type: 'ball', c: n.pos.clone(), r: rMax * 0.94 }); vol += 4 / 3 * Math.PI * rMax ** 3 * 0.35; }
    const m = PVC_DENSITY * vol * 1e-9, k = shapes.length - first;
    for (let i = first; i < shapes.length; i++) shapes[i].mass = m / k; // la masa del accesorio, repartida entre sus formas
    mass += m;
  }
  // mm (Z vertical) → metros (Y vertical): giro de −90° sobre X y escala 0,001
  const toM = new THREE.Matrix4().makeRotationX(-Math.PI / 2).premultiply(new THREE.Matrix4().makeScale(MM, MM, MM));
  const box = new THREE.Box3();
  for (const [k, list] of Object.entries(byMat)) {
    if (!list.length) continue;
    const g = mergeGeometries(list, false); list.forEach(x => x.dispose());
    g.applyMatrix4(toM); g.computeBoundingBox(); box.union(g.boundingBox);
    const m = new THREE.Mesh(g, mats[k]); m.castShadow = true; m.receiveShadow = true; assembly.add(m);
  }
  if (box.isEmpty()) { current.size = new THREE.Vector3(); return; }
  // apoyada en el suelo y centrada en planta
  const c = box.getCenter(new THREE.Vector3());
  const shift = new THREE.Vector3(-c.x, -box.min.y, -c.z);
  for (const m of assembly.children) m.geometry.translate(shift.x, shift.y, shift.z);
  current.size = box.getSize(new THREE.Vector3());
  current.mass = mass;
  current.toWorld = toM.clone().premultiply(new THREE.Matrix4().makeTranslation(shift.x, shift.y, shift.z)); // mm del proyecto → metros de la escena
  current.shapes = shapes;
  buildPhysics();
  const half = Math.max(current.size.x, current.size.z) / 2 + 0.3, cam = sun.shadow.camera;
  cam.left = cam.bottom = -half * 1.4; cam.right = cam.top = half * 1.4; cam.near = 0.1; cam.far = 12; cam.updateProjectionMatrix();
  current.triangles = assembly.children.reduce((t, m) => t + m.geometry.attributes.position.count / 3, 0);
}

// ---------------------------------------------------------------- carga
async function openProject(json, source) {
  const model = new Model();
  model.load(json);
  if (!json.name && source) model.name = source;
  const an = analyze(model);
  current = { model, analysis: an, json };
  buildAssembly();
  $('#start').hidden = true; $('#bar').hidden = false; $('#info').hidden = innerWidth <= 700; // en el móvil, con el botón ⓘ
  $('#name').textContent = model.name || 'Proyecto sin título';
  document.title = `${model.name || 'Proyecto'} · PipeCAD RA`;
  showFacts(); makeGrid(Math.max(current.size.x, current.size.z) + 1); homeView(); requestRender();
  const bad = [...an.nodes.values()].filter(n => n.errors.length).length;
  message(bad ? `⚠ El proyecto tiene ${bad} unión(es) no válida(s): se muestran tal cual` : `Proyecto «${model.name}» cargado a tamaño real · arrástralo para cogerlo`, bad ? 'err' : '');
}
function showFacts() {
  const { analysis: an, size, mass } = current;
  const tubes = [...an.segs.values()].filter(s => s.Lr > 0).length;
  const fits = [...an.nodes.values()].filter(n => !['end', 'invalid', 'isolated'].includes(n.kind)).length;
  const m = x => fmt(x, 2).replace(/^0,/, '0,') + ' m';
  $('#facts').innerHTML = `
    <dt>Tubos</dt><dd>${tubes}</dd><dt>Accesorios</dt><dd>${fits}</dd>
    <dt>Ancho × fondo</dt><dd>${m(size.x)} × ${m(size.z)}</dd><dt>Alto</dt><dd>${m(size.y)}</dd>
    <dt>Peso aprox.</dt><dd>${fmt(mass, mass < 10 ? 2 : 1)} kg</dd>`;
}

// ---------------------------------------------------------------- física (Rapier)
// La estructura encolada es un único cuerpo rígido compuesto: un cilindro por tubo y por boca de
// accesorio y una bola en el centro de los que ramifican, con la masa del PVC repartida entre ellos
// (el centro de gravedad sale solo). El suelo es fijo, en y = 0 del escenario (el suelo real en RA).
// Paso fijo de 1/90 s, independiente de la frecuencia de la pantalla o de las gafas.
const PH = { R: null, world: null, body: null, loading: null, active: true, acc: 0, error: '', step: 1 / 90 };
function loadPhysics() {
  PH.loading ||= import('@dimforge/rapier3d-compat')
    .then(async mod => { const R = mod.default ?? mod; await R.init(); PH.R = R; buildPhysics(); return R; })
    .catch(err => { PH.error = err.message; console.warn('Física no disponible', err); message('No se ha podido cargar la física (Rapier): la estructura se verá sin gravedad', 'err', 8000); return null; });
  return PH.loading;
}
function buildPhysics() {
  const R = PH.R; if (!R || !current?.shapes) return;
  if (PH.world) { PH.world.free(); PH.world = PH.body = null; }
  const world = new R.World({ x: 0, y: -9.81, z: 0 });
  world.timestep = PH.step;
  world.createCollider(R.ColliderDesc.cuboid(100, 0.5, 100).setTranslation(0, -0.5, 0).setFriction(0.8).setRestitution(0.05)); // suelo
  const body = world.createRigidBody(R.RigidBodyDesc.dynamic().setCcdEnabled(true).setLinearDamping(0.05).setAngularDamping(0.15).setCanSleep(true));
  const M = current.toWorld, a = new THREE.Vector3(), b = new THREE.Vector3(), q = new THREE.Quaternion();
  PH.local = [];
  for (const sh of current.shapes) {
    let desc;
    if (sh.type === 'cyl') {
      a.copy(sh.a).applyMatrix4(M); b.copy(sh.b).applyMatrix4(M);
      const len = a.distanceTo(b); if (len < 1e-4) continue;
      PH.local.push({ type: 'cyl', a: a.clone(), b: b.clone(), r: sh.r * MM });
      q.setFromUnitVectors(Y, b.clone().sub(a).normalize());
      desc = R.ColliderDesc.cylinder(len / 2, sh.r * MM).setTranslation((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2).setRotation({ x: q.x, y: q.y, z: q.z, w: q.w });
    } else {
      a.copy(sh.c).applyMatrix4(M);

  const ua = navigator.userAgent, quest = /OculusBrowser|Quest/i.test(ua), ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// ---------------------------------------------------------------- realidad aumentada (WebXR: Meta Quest 3 y Android)
// Colocación: una retícula sigue al suelo (prueba de impacto o, si no hay, el suelo de la sala a la

// gafas, toque en el teléfono o «Colocar aquí») la deja apoyada, mirando hacia el usuario.
renderer.xr.enabled = true;

const reticle = new THREE.Group(); reticle.visible = false; scene.add(reticle);
{
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.09, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, depthTest: false }));

  ring.renderOrder = dot.renderOrder = 20; reticle.add(ring, dot);
}

function makeFootprint() {
  if (footprint) { stage.remove(footprint); footprint.geometry.dispose(); }

  const g = new THREE.BufferGeometry().setFromPoints([[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz], [-hx, -hz]].map(([a, b]) => new THREE.Vector3(a, 0.002, b)));

  stage.add(footprint);
}

  for (const m of assembly.children) m.castShadow = !on;

}
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0);
// Giro alrededor de la vertical para que la estructura mire al usuario
function yawTowardViewer(pos) {

}
// Impacto horizontal (suelo o mesa) de la prueba de impacto, o null
function floorFromHit(frame) {

  for (const hit of frame.getHitTestResults(XR.hitSource)) {

}
// Sin prueba de impacto: rayo de la mirada contra el plano del suelo (altura conocida)

// Altura del suelo: «local-floor» la da (0) y, en las Quest 3, el plano detectado con la etiqueta «floor»

$('#b-enter').onclick = enterAR;
$('#xr-place').onclick = () => place();
$('#xr-replace').onclick = () => startPlacing();
$('#xr-exit').onclick = () => XR.session?.end();

const pickFile = () => $('#file').click();
$('#file').onchange = async e => {
