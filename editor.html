<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de accesorios</title>
<style>
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel-2:#f7f8fa; --border:#d8dce2; --text:#1c2128; --muted:#66707c;
  --accent:#2f6fde; --accent-soft:#e3ecfb; --accent-text:#ffffff; --hover:#eef1f5;
  --viewport:#e8ecf1; --ok:#2b8a53; --warn:#c77d00; --err:#d4373c; --fitting:#d9dde2; --code:#f6f8fa;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --panel:#1d2127; --panel-2:#22272e; --border:#323840; --text:#e2e6eb; --muted:#8b95a1;
    --accent:#5b8ff0; --accent-soft:#24324a; --hover:#2a3038; --viewport:#20252b;
    --ok:#4cbf7d; --warn:#e8a33a; --err:#f0616a; --fitting:#c9ced5; --code:#171a1f;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{font-weight:700;margin-right:10px;white-space:nowrap}
.brand span{color:var(--accent)}
.brand small{font-weight:500;color:var(--muted)}
.group{display:flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid var(--border)}
.group:last-child{border-right:0}
button,select,input{font:inherit;color:var(--text)}
button,select{background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;min-height:30px;cursor:pointer}
button:hover:not(:disabled),select:hover{background:var(--hover)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;min-height:30px}
input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:3px 6px;min-height:28px;width:100%}
input.bad{border-color:var(--err)}
main{display:grid;grid-template-columns:minmax(380px,460px) 1fr;min-height:0}
#form{overflow:auto;padding:12px 14px 30px;background:var(--panel);border-right:1px solid var(--border)}
#right{display:grid;grid-template-rows:1fr minmax(200px,38%);min-height:0}
h2{font-size:14px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
h2:first-child{margin-top:2px}
.hint{color:var(--muted);font-size:12px;margin:4px 0}
.row{display:grid;grid-template-columns:110px 1fr;gap:6px;align-items:center;margin:4px 0}
table{width:100%;border-collapse:collapse}
th,td{padding:3px 3px;text-align:left;font-size:12px}
th{color:var(--muted);font-weight:600}
td input{min-height:26px;padding:2px 5px}
td select{min-height:26px;padding:1px 4px;width:100%}
.mini{min-height:24px;padding:1px 7px;font-size:12px}
.card{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel-2)}
.card-h{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.card-h input{max-width:110px}
.angles{font-size:12px;color:var(--muted);margin:4px 0 0}
.msgs .m{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:5px 8px;margin:4px 0}
.msgs .err{border-color:var(--err);color:var(--err)}
.msgs .warn{border-color:var(--warn);color:var(--warn)}
.msgs .ok{border-color:var(--ok);color:var(--ok)}
#view{position:relative;background:var(--viewport);min-height:0;overflow:hidden}
#view canvas{display:block}
#view-tl{position:absolute;left:10px;top:10px;right:10px;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#view-tl>*{pointer-events:auto}
#plane-giz{flex:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2px;line-height:0}
#plane-giz svg{width:84px;height:82px;display:block}
#plane-giz .pl{cursor:pointer;outline:none}
#plane-giz .pl polygon{fill:var(--panel-2);stroke:var(--border);stroke-width:1.2;stroke-linejoin:round}
#plane-giz .pl:hover polygon,#plane-giz .pl:focus-visible polygon{fill:var(--hover);stroke:var(--muted)}
#plane-giz .pl.on polygon{fill:var(--accent-soft);stroke:var(--accent)}
#plane-giz text{font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;fill:var(--muted);pointer-events:none}
#plane-giz .pl.on text{fill:var(--accent)}
#view-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
#view-info{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:12px;max-width:calc(100% - 20px)}
#src-banner{position:absolute;left:10px;right:10px;top:106px;background:var(--panel);border:1px solid var(--warn);color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px}
#src-banner b{color:var(--warn)}
#giz-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap;z-index:2}
.giz-key{display:inline-flex;gap:8px;font-size:12px;color:var(--muted);cursor:help}
.giz-key i{font-style:normal}
#busy{position:absolute;right:12px;top:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px}
#code{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--border);background:var(--panel)}
.tabs{display:flex;gap:2px;align-items:center;border-bottom:1px solid var(--border);padding:0 8px}
.tabs button{border:0;border-radius:0;background:transparent;border-bottom:2px solid transparent;padding:7px 10px}
.tabs button.on{border-bottom-color:var(--accent);color:var(--accent);background:transparent}
.tabs .sp{flex:1}
.pane{display:none;flex:1;min-height:0}
.pane.on{display:flex;flex-direction:column}
textarea,pre.code{flex:1;margin:0;border:0;resize:none;background:var(--code);color:var(--text);font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;padding:10px 12px;overflow:auto;white-space:pre;tab-size:2}
textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
#manual-banner{background:var(--accent-soft);color:var(--accent);font-size:12px;padding:5px 10px;display:flex;gap:8px;align-items:center}
#log .e{color:var(--err)} #log .w{color:var(--warn)}
footer{padding:4px 12px;background:var(--panel);border-top:1px solid var(--border);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr}
  #form{border-right:0;border-bottom:1px solid var(--border)}
  #right{grid-template-rows:60vh 420px}
  header{padding:6px 16px}
  .group{border-right:0}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Pipe<span>CAD</span> <small>· Editor de accesorios</small></div>
    <div class="group">
      <button id="b-new" title="Empezar un accesorio nuevo desde cero">Nuevo</button>
      <select id="s-template" title="Empezar desde una plantilla (modelos/plantillas)" aria-label="Plantilla">
        <option value="">Desde plantilla…</option>
      </select>
      <button id="b-open" title="Abrir un .pcf (y, si quieres, su .scad)">Abrir…</button>
      <select id="s-lib" title="Editar un accesorio de la biblioteca de PipeCAD" aria-label="Biblioteca de PipeCAD"></select>
      <button id="b-folder" title="Elegir la carpeta «modelos» de PipeCAD (cuando no se usa el servidor local)" hidden>Carpeta de modelos…</button>
      <input id="file" type="file" accept=".pcf,.txt,.scad" multiple hidden>
      <input id="folder" type="file" webkitdirectory multiple hidden>
    </div>
    <div class="group">
      <button id="b-dl-scad" title="Descargar el código OpenSCAD, con la librería incluida para abrirlo suelto en OpenSCAD">Descargar .scad</button>
      <button id="b-dl-stl" title="Generar con OpenSCAD y descargar el STL de la variante elegida">Descargar .stl</button>
      <button id="b-dl-pcf" title="Descargar la definición .pcf">Descargar .pcf</button>
      <button id="b-dl-zip" title="Descargar en un .zip el .pcf, el .scad y los STL de todas las variantes">Descargar .zip</button>
    </div>
    <div class="group">
      <button id="b-save" class="primary" title="Generar los STL de todas las variantes y guardar el accesorio en la biblioteca de PipeCAD">Guardar en PipeCAD</button>
      <a class="btn" href="index.html" target="pipecad" title="Abrir PipeCAD">Ir a PipeCAD</a>
    </div>
  </header>
  <main>
    <section id="form" aria-label="Definición del accesorio"></section>
    <section id="right">
      <div id="view">
        <div id="view-tl">
        <div id="plane-giz" role="group" aria-label="Plano de trabajo" title="Plano de trabajo: la rejilla y los giros de las bocas se refieren a él">
          <svg viewBox="0 0 84 82" aria-hidden="false">
            <g class="pl" data-plane="XZ" role="button" tabindex="0" aria-label="Plano XZ"><polygon points="42,46 68,61 68,31 42,16"/><text x="55" y="39">XZ</text></g>
            <g class="pl" data-plane="YZ" role="button" tabindex="0" aria-label="Plano YZ"><polygon points="42,46 16,61 16,31 42,16"/><text x="29" y="39">YZ</text></g>
            <g class="pl" data-plane="XY" role="button" tabindex="0" aria-label="Plano XY"><polygon points="42,46 68,61 42,76 16,61"/><text x="42" y="61">XY</text></g>
            <text x="76" y="69">X</text><text x="8" y="69">Y</text><text x="42" y="8">Z</text>
          </svg>
        </div>
        <div id="view-bar">
          <label>Variante <select id="s-variant"></select></label>
          <button id="b-render" class="primary" title="Generar el modelo con OpenSCAD">Generar con OpenSCAD</button>
          <label title="Volver a generar al cambiar el formulario"><input type="checkbox" id="c-auto" checked> Automático</label>
          <label title="Mostrar en la vista los tiradores para editar el accesorio arrastrando"><input type="checkbox" id="c-giz" checked> Gizmos</label>
          <span class="giz-key" id="giz-key" title="Arrastra un tirador para editar la boca. Alt: ajuste fino · Esc: cancelar el arrastre"><span><i style="color:#2f6fde">⟲</i> Giro</span><span><i style="color:#e8862a">◆</i> Z</span><span><i style="color:#2b9a5b">◆</i> Embocadura</span></span>
        </div>
        </div>
        <div id="giz-tip" hidden></div>
        <div id="busy" hidden></div>
        <div id="src-banner" hidden></div>
        <div id="view-info">Pulsa «Generar con OpenSCAD» para ver el modelo.</div>
      </div>
      <div id="code">
        <div class="tabs" role="tablist">
          <button data-pane="scad" class="on">OpenSCAD</button>
          <button data-pane="pcf">.pcf</button>
          <button data-pane="log">Registro de OpenSCAD</button>
          <span class="sp"></span>
          <button id="b-copy" class="mini" title="Copiar el contenido de la pestaña">Copiar</button>
        </div>
        <div class="pane on" id="pane-scad">
          <div id="manual-banner" hidden>Código editado a mano: el formulario ya no lo sobrescribe. <button id="b-regen" class="mini">Volver a generarlo desde el formulario</button></div>
          <textarea id="scad" spellcheck="false" aria-label="Código OpenSCAD"></textarea>
        </div>
        <div class="pane" id="pane-pcf"><pre class="code" id="pcf"></pre></div>
        <div class="pane" id="pane-log"><pre class="code" id="log">Sin ejecuciones todavía.</pre></div>
      </div>
    </section>
  </main>
  <footer id="status">Listo</footer>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);

/* =====================================================================
   UTILIDADES Y LENGUAJE .pcf (mismo formato que PipeCAD)
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NF = {}; const fmt = (x, d = 1) => (NF[d] ||= new Intl.NumberFormat('es-ES', { maximumFractionDigits: d })).format(Math.round(x * 10 ** d) / 10 ** d);
const parseNum = s => { s = String(s ?? '').trim(); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return s === '' ? NaN : parseFloat(s); };
const fmtN = x => String(Math.round(x * 1e6) / 1e6);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } } };
const DIAMETERS = [20, 32, 40];
const TYP = { 20: { socket: 16, od: 27, z: 11, pass: 16 }, 32: { socket: 22, od: 41, z: 17, pass: 27 }, 40: { socket: 26, od: 50, z: 21, pass: 34 } };
const BUILTIN_IDS = ['elbow90', 'elbow45', 'tee', 'teeReduced', 'coupling', 'reducer'];
const status = m => { $('#status').textContent = m; };
function download(name, data, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const bufToB64 = buf => { const u8 = new Uint8Array(buf); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };

const PCF_KEYS = { DIAMETROS: 'ds', 'DIÁMETROS': 'ds', Z: 'zs', EMBOCADURA: 'sockets', EXTERIOR: 'od', PASO: 'pass' };
function tokenizePCF(line) { const out = [], re = /"([^"]*)"|(\S+)/g; let m; while ((m = re.exec(line))) out.push(m[1] ?? m[2]); return out; }
function parsePCF(text) {
  const def = { id: '', name: '', desc: '', ports: [], variants: [], models: {} }, errs = [];
  String(text).split(/\r?\n/).forEach((raw, i) => {
    const line = raw.replace(/#.*$/, '').trim(); if (!line) return;
    const t = tokenizePCF(line), key = t[0].toUpperCase(), ln = i + 1;
    const num = (s, what) => { const v = parseNum(s); if (!isFinite(v)) errs.push(`Línea ${ln}: ${what} debe ser un número («${s ?? ''}»)`); return v; };
    switch (key) {
      case 'ACCESORIO': def.id = (t[1] || '').toLowerCase(); if (def.id && !/^[a-z0-9_-]+$/.test(def.id)) errs.push('El identificador solo admite letras sin tildes, números, «-» y «_»'); break;
      case 'NOMBRE': def.name = t.slice(1).join(' '); break;
      case 'DESCRIPCION': case 'DESCRIPCIÓN': def.desc = t.slice(1).join(' '); break;
      case 'BOCA': {
        if (t.length !== 5) { errs.push(`Línea ${ln}: BOCA necesita un nombre y tres números`); break; }
        const v = new THREE.Vector3(num(t[2], 'X'), num(t[3], 'Y'), num(t[4], 'Z'));
        if (!(v.lengthSq() > 1e-12)) { errs.push(`Boca «${t[1]}»: la dirección no puede ser 0 0 0`); break; }
        if (def.ports.some(p => p.name === t[1])) errs.push(`La boca «${t[1]}» está repetida`);
        def.ports.push({ name: t[1], dir: v.normalize() }); break;
      }
      case 'VARIANTE': {
        const v = { name: t[1], ds: [], zs: [], sockets: [], pass: [], od: NaN, line: ln }; let cur = null;
        if (!t[1] || PCF_KEYS[t[1].toUpperCase()]) { errs.push(`Línea ${ln}: falta el nombre de la variante`); break; }
        for (const tok of t.slice(2)) {
          const k = PCF_KEYS[tok.toUpperCase()]; if (k) { cur = k; continue; }
          if (!cur) { errs.push(`Línea ${ln}: «${tok}» fuera de lugar`); continue; }
          const val = num(tok, cur); if (cur === 'od') v.od = val; else v[cur].push(val);
        }
        def.variants.push(v); break;
      }
      case 'MODELO': if (t.length === 3) def.models[t[1]] = t[2]; break;
      default: errs.push(`Línea ${ln}: palabra clave desconocida «${t[0]}»`);
    }
  });
  if (!def.id) errs.push('Falta el identificador');
  if (BUILTIN_IDS.includes(def.id)) errs.push(`«${def.id}» es el identificador de un accesorio de serie: usa otro`);
  if (!def.name) def.name = def.id;
  if (!def.ports.length) errs.push('El accesorio necesita al menos una boca');
  if (!def.variants.length) errs.push('El accesorio necesita al menos una variante');
  const n = def.ports.length;
  for (const v of def.variants) {
    const w = `Variante «${v.name}»`;
    for (const [k, label] of [['ds', 'Ø'], ['zs', 'Z'], ['sockets', 'embocadura']]) if (v[k].length !== n) errs.push(`${w}: faltan valores de ${label}`);
    if (v.ds.some(d => !DIAMETERS.includes(d))) errs.push(`${w}: los diámetros deben ser 20, 32 o 40`);
    if (v.zs.some(z => !(z >= 0))) errs.push(`${w}: la Z no puede ser negativa`);
    if (v.sockets.some(s => !(s > 0))) errs.push(`${w}: la embocadura debe ser mayor que 0`);
    if (!(v.od > Math.max(...v.ds))) errs.push(`${w}: el Ø exterior debe ser mayor que el mayor de los diámetros`);
    if (v.pass.length && v.pass.length !== n) errs.push(`${w}: rellena el paso de todas las bocas o de ninguna`);
    if (v.pass.some((p, k) => !(p > 0) || p >= v.ds[k])) errs.push(`${w}: cada paso debe ser mayor que 0 y menor que el Ø de su boca`);
    if (!v.pass.length) delete v.pass;
  }
  const names = def.variants.map(v => v.name);
  if (new Set(names).size !== names.length) errs.push('Hay variantes con el mismo nombre');
  if (errs.length) { const e = new Error(errs.join('\n')); e.list = [...new Set(errs)]; throw e; }
  return def;
}

/* =====================================================================
   ESTADO DEL EDITOR, PLANTILLAS
   ===================================================================== */
const S = { id: '', name: '', desc: '', ports: [], variants: [], clearance: 0.25, fn: 64, manualScad: null };
const varFor = (ds, z) => ({ od: TYP[Math.max(...ds)].od, rows: ds.map((d, i) => ({ d, z: Array.isArray(z) ? z[i] : z, s: TYP[d].socket, pass: '' })) });
// Accesorio nuevo desde cero: dos bocas opuestas y una variante de Ø32 con medidas típicas
function newFitting() {
  Object.assign(S, { id: '', name: '', desc: '', ports: [{ name: 'A', dir: [1, 0, 0] }, { name: 'B', dir: [-1, 0, 0] }],
    variants: [{ name: '32', ...varFor([32, 32], TYP[32].z) }], manualScad: null });
  framed = ''; disposeGroup(meshG); stale = false; $('#view-info').textContent = 'Accesorio nuevo: ponle un identificador y define sus bocas y variantes.';
  renderForm(); changed(true); dirty = false;
  status('Accesorio nuevo: rellena el identificador, el nombre, las bocas y las variantes');
}

/* =====================================================================
   CARPETA DE MODELOS: catálogo, plantillas, librería OpenSCAD y guardado
   =====================================================================
   Los archivos 3D viven en modelos/ (junto a las páginas):
     catalogo.json · pipecad.scad · serie/ · personalizados/ · plantillas/
   Se leen por HTTP (GitHub Pages o el servidor local) o, si la página se abre como archivo,
   desde la carpeta que elija el usuario. Para guardar hace falta el servidor local (servidor.mjs)
   o un navegador que permita escribir en una carpeta (Chrome, Edge). */
const SRC = { files: null, dir: null, server: false, catalog: null, lib: '', error: '' };
const LIB_FILE = 'pipecad.scad', LIB_USE = /^\s*(use|include)\s*<\.\.\/pipecad\.scad>\s*;?\s*$/m;
async function readModelFile(rel, binary = false) {
  if (SRC.dir) { // carpeta elegida con permiso de escritura
    let h = SRC.dir; const parts = rel.split('/');
    for (const p of parts.slice(0, -1)) h = await h.getDirectoryHandle(p);
    const f = await (await h.getFileHandle(parts.at(-1))).getFile();
    return binary ? new Uint8Array(await f.arrayBuffer()) : f.text();
  }
  if (SRC.files) {
    const f = SRC.files.get(rel); if (!f) throw new Error(`No está ${rel} en la carpeta elegida`);
    return binary ? new Uint8Array(await f.arrayBuffer()) : f.text();
  }
  let r; try { r = await fetch('modelos/' + rel, { cache: 'no-cache' }); } catch { throw new Error(`no se puede leer modelos/${rel} (página abierta como archivo, sin servidor)`); }
  if (!r.ok) throw new Error(`modelos/${rel}: ${r.status}`);
  return binary ? new Uint8Array(await r.arrayBuffer()) : r.text();
}
async function loadSources() {
  if (!SRC.files && !SRC.dir && location.protocol.startsWith('http')) {
    try { const r = await fetch('api/estado', { cache: 'no-store' }); const j = r.ok ? await r.json() : {}; SRC.server = !!j.pipecad && j.escribir !== false; } catch { SRC.server = false; }
  }

   GENERADORES: .pcf y OpenSCAD
   ===================================================================== */
const unit = d => { const l = Math.hypot(...d) || 1; return d.map(x => x / l); };
function pcfText(models = null) {
  const L = ['# PipeCAD · definición de accesorio (lenguaje .pcf), creada con el editor de accesorios', '# Medidas en mm. Origen: punto donde se cortan los ejes de las bocas.', `ACCESORIO ${S.id}`, `NOMBRE "${S.name || S.id}"`];
  if (S.desc) L.push(`DESCRIPCION "${S.desc}"`);
  L.push('');
  for (const p of S.ports) L.push(`BOCA ${p.name}  ${p.dir.map(fmtN).join(' ')}`);
  L.push('');
  for (const v of S.variants) {
    const hasPass = v.rows.some(r => r.pass !== '' && r.pass != null);
    L.push(`VARIANTE ${v.name}  DIAMETROS ${v.rows.map(r => r.d).join(' ')}  Z ${v.rows.map(r => fmtN(r.z)).join(' ')}  EMBOCADURA ${v.rows.map(r => fmtN(r.s)).join(' ')}`
      + (hasPass ? `  PASO ${v.rows.map(r => r.pass === '' ? fmtN(TYP[r.d].pass) : fmtN(r.pass)).join(' ')}` : '') + `  EXTERIOR ${fmtN(v.od)}`);
  }
  if (models) { L.push(''); for (const [k, f] of Object.entries(models)) L.push(`MODELO ${k} ${f}`); }
  return L.join('\n') + '\n';
}
// Código OpenSCAD paramétrico: todas las variantes; se elige con «variante» (Personalizador de OpenSCAD)
function scadText() {
  const vnames = S.variants.map(v => v.name);
  const n = S.ports.length, q = s => `"${String(s).replace(/"/g, '')}"`;
  const bocas = S.ports.map(p => `  [${q(p.name)}, [${unit(p.dir).map(fmtN).join(', ')}]]`).join(',\n');
  const vars = S.variants.map(v => `  [${q(v.name)}, ${fmtN(v.od)}, [${v.rows.map(r => `[${r.d}, ${fmtN(r.z)}, ${fmtN(r.s)}, ${fmtN(r.pass === '' || r.pass == null ? TYP[r.d].pass : r.pass)}]`).join(', ')}]]`).join(',\n');
  return `// PipeCAD · ${S.name || S.id} (${S.id})
// Código generado por el editor de accesorios de PipeCAD. Medidas en milímetros.
// Origen: punto donde se cortan los ejes de todas las bocas. Cada boca apunta hacia fuera.
// Pieza imprimible: cuerpo + embocaduras taladradas (Ø tubo + holgura) + paso interior.
// Necesita ../pipecad.scad; «Descargar .scad» del editor la incluye dentro para abrirlo suelto.

/* [Fabricación] */
// Variante a generar
variante = ${q(vnames[0] ?? '')}; // [${vnames.map(v => String(v).replace(/[,\]]/g, '')).join(', ')}]
// Holgura radial de las embocaduras (mm)
holgura = ${fmtN(S.clearance)}; // [0:0.05:0.6]
// Resolución de los círculos (número de lados)
$fn = ${S.fn}; // [24:8:192]

/* [Hidden] */
// Bocas: [nombre, dirección hacia fuera]
BOCAS = [
${bocas}
];
// Variantes: [nombre, Ø exterior, por boca: [Ø tubo, Z (origen → tope), embocadura, Ø paso]]
VARIANTES = [
${vars}
];

// Geometría: librería común de PipeCAD (modelos/pipecad.scad)
use <../pipecad.scad>

accesorio_pipecad(BOCAS, VARIANTES, variante, holgura);
`;
}
const currentScad = () => S.manualScad ?? scadText();
// Versión autónoma (para abrirla con OpenSCAD fuera de la carpeta modelos): la librería va dentro
const standaloneScad = code => SRC.lib && LIB_USE.test(code)
  ? code.replace(LIB_USE, () => '// ---- librería pipecad.scad (incluida) ----\n' + SRC.lib.replace(/\r\n/g, '\n').trimEnd() + '\n// ---- fin de la librería ----')
  : code;

/* =====================================================================
   VALIDACIÓN
   ===================================================================== */
function validate() {
  const msgs = [];
  let def = null;
  try { def = parsePCF(pcfText()); } catch (e) { for (const t of e.list || [e.message]) msgs.push({ cls: 'err', t }); }
  if (def) {
    for (const v of S.variants) {
      const R = v.od / 2;
      v.rows.forEach((r, i) => {
        const pass = r.pass === '' ? TYP[r.d].pass : +r.pass;
        const ws = R - (r.d / 2 + S.clearance), wb = R * 0.94 - pass / 2;
        if (ws < 1.2) msgs.push({ cls: 'warn', t: `Variante ${v.name}, boca ${S.ports[i]?.name}: pared de la embocadura de ${fmt(ws, 2)} mm (mínimo recomendable 1,2)` });
        if (wb < 1.2) msgs.push({ cls: 'warn', t: `Variante ${v.name}, boca ${S.ports[i]?.name}: pared del paso de ${fmt(wb, 2)} mm` });
      });
    }
    // bocas que se solapan: dos embocaduras con un ángulo muy cerrado
    for (let i = 0; i < S.ports.length; i++) for (let j = i + 1; j < S.ports.length; j++) {
      const a = unit(S.ports[i].dir), b = unit(S.ports[j].dir), ang = Math.acos(Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]))) * 180 / Math.PI;
      if (ang < 30) msgs.push({ cls: 'warn', t: `Las bocas ${S.ports[i].name} y ${S.ports[j].name} forman ${fmt(ang)}°: probablemente se solapen` });
    }
  }
  return { def, msgs };
}

    const g = showModel(r.stl); g.computeBoundingBox();
    const sz = g.boundingBox.getSize(new THREE.Vector3()), info = r.info, pieces = countPieces(r.stl);
    $('#view-info').innerHTML = `Variante <b>${esc(variant)}</b> · ${fmt(g.getAttribute('position').count / 3, 0)} triángulos · ${fmt(r.stl.length / 1024, 0)} KB · ${fmt(sz.x)} × ${fmt(sz.y)} × ${fmt(sz.z)} mm`
      + (pieces === 1 ? ' · <span style="color:var(--ok)">una sola pieza</span>' : ` · <span style="color:var(--err)">✘ ${pieces} piezas separadas: revisa Z, embocaduras y paso</span>`)
      + (info?.warnings.length ? ` · <span style="color:var(--warn)">${info.warnings.length} aviso(s) de OpenSCAD</span>` : '');
    status(`Modelo generado con OpenSCAD${r.ms ? ` en ${fmt(r.ms / 1000, 1)} s` : ''}`);
  } catch (e) {
    if (seq !== previewSeq) return;
    $('#view-info').innerHTML = `<span style="color:var(--err)">✘ ${esc(e.message)}</span> · mira la pestaña «Registro de OpenSCAD»`;
    status('✘ OpenSCAD no ha podido generar el modelo: ' + e.message);
  }
}

/* =====================================================================
   ARCHIVOS, BIBLIOTECA DE PIPECAD Y PESTAÑAS
   ===================================================================== */
$$('.tabs [data-pane]').forEach(b => b.onclick = () => {
  $$('.tabs [data-pane]').forEach(x => x.classList.toggle('on', x === b));
  $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + b.dataset.pane));

$('#b-copy').onclick = async () => {
  const pane = $('.tabs [data-pane].on').dataset.pane, text = pane === 'scad' ? $('#scad').value : pane === 'pcf' ? $('#pcf').textContent : $('#log').textContent;
  try { await navigator.clipboard.writeText(text); status('Copiado al portapapeles'); } catch { status('No se pudo copiar: selecciona el texto y usa Ctrl+C'); }
};
$('#scad').addEventListener('input', e => { S.manualScad = e.target.value; dirty = true; $('#manual-banner').hidden = false; clearTimeout(renderTimer); if ($('#c-auto').checked) renderTimer = setTimeout(renderPreview, 1200); });
$('#b-regen').onclick = () => { S.manualScad = null; changed(true); status('Código OpenSCAD regenerado desde el formulario'); };
$('#b-render').onclick = () => renderPreview();
$('#s-variant').onchange = () => { buildOverlay(); renderPreview(); };
$('#c-auto').onchange = e => { if (e.target.checked) renderPreview(); };
$('#b-dl-scad').onclick = () => {
  const code = standaloneScad(currentScad());
  download(`${S.id || 'accesorio'}.scad`, code, 'text/plain;charset=utf-8');
  status(`${S.id}.scad descargado${code !== currentScad() ? ' con la librería incluida' : ''}: ábrelo con OpenSCAD (Personalizador: variante, holgura y resolución)`);
};
$('#b-dl-pcf').onclick = () => { download(`${S.id}.pcf`, pcfText(), 'text/plain;charset=utf-8'); status(`${S.id}.pcf descargado`); };
$('#b-dl-stl').onclick = async () => {
  const v = $('#s-variant').value;
  try { const { stl } = await stlFor(v); download(`${S.id}_${v}.stl`, stl, 'model/stl'); status(`${S.id}_${v}.stl descargado (generado con OpenSCAD)`); }
  catch (e) { status('✘ ' + e.message); }
};

// ---- Guardar: STL de todas las variantes y archivos en modelos/personalizados
async function allStls() {
  const out = {};
  for (const v of S.variants) {
    status(`Generando con OpenSCAD la variante ${v.name} (${Object.keys(out).length + 1} de ${S.variants.length})…`);
    const r = await stlFor(v.name), pieces = countPieces(r.stl);
    if (pieces !== 1 && !confirm(`La variante ${v.name} sale en ${pieces} piezas separadas (no se podría imprimir como un accesorio). ¿Seguir igualmente?`)) { status(`Cancelado: revisa la variante ${v.name}`); return null; }
    out[v.name] = r.stl;
  }
  return out;
}
const modelsOf = stls => Object.fromEntries(Object.keys(stls).map(v => [v, `${S.id}_${v}.stl`]));
// Entrada del catálogo (la misma que escribe servidor.mjs)
function catalogEntry(stls) {
  const rel = f => `personalizados/${f}`;
  return { id: S.id, tipo: 'personalizado', nombre: S.name || S.id, pcf: rel(`${S.id}.pcf`), stl: Object.fromEntries(Object.keys(stls).map(v => [v, rel(`${S.id}_${v}.stl`)])), scad: rel(`${S.id}.scad`) };
}
const notifyPipeCAD = () => { try { const ch = new BroadcastChannel('pipecad'); ch.postMessage({ tipo: 'modelos', id: S.id }); ch.close(); } catch { /* sin canal */ } };
async function saveToServer(stls) {
  const body = { id: S.id, nombre: S.name || S.id, pcf: pcfText(modelsOf(stls)), scad: currentScad(), stl: Object.fromEntries(Object.entries(stls).map(([v, u8]) => [v, bufToB64(u8)])) };
  const r = await fetch('api/accesorios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `el servidor respondió ${r.status}`);
  return j.actualizado;
}
async function saveToDir(stls) {
  const dir = SRC.dir;
  if (dir.requestPermission && (await dir.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('no hay permiso para escribir en la carpeta');
  const cat = JSON.parse(await readModelFile('catalogo.json')); cat.accesorios ||= [];
  const prev = cat.accesorios.find(a => a.id === S.id);
  if (prev && prev.tipo !== 'personalizado') throw new Error(`«${S.id}» es un accesorio de serie`);
  const sub = await dir.getDirectoryHandle('personalizados', { create: true });
  const put = async (h, name, data) => { const w = await (await h.getFileHandle(name, { create: true })).createWritable(); await w.write(data); await w.close(); };
  await put(sub, `${S.id}.pcf`, pcfText(modelsOf(stls)));
  await put(sub, `${S.id}.scad`, currentScad());
  for (const [v, u8] of Object.entries(stls)) await put(sub, `${S.id}_${v}.stl`, u8);
  if (prev) for (const [v, f] of Object.entries(prev.stl || {})) if (!stls[v]) { try { await sub.removeEntry(f.split('/').pop()); } catch { /* ya no estaba */ } }
  cat.accesorios = cat.accesorios.filter(a => a.id !== S.id); cat.accesorios.push(catalogEntry(stls));
  await put(dir, 'catalogo.json', JSON.stringify(cat, null, 2) + '\n');
  return !!prev;
}
// Sin servidor ni carpeta: en el almacenamiento del navegador (PipeCAD de este navegador lo ve)
function saveToBrowser(stls) {
  let lib; try { lib = JSON.parse(store.get('pipecad-lib') || '{}'); } catch { lib = {}; }
  const before = (lib.custom || []).length;
  lib.disabled ||= []; lib.custom = (lib.custom || []).filter(c => { try { return parsePCF(c.source).id !== S.id; } catch { return true; } });
  const models = modelsOf(stls);
  lib.custom.push({ source: pcfText(models), stl: Object.fromEntries(Object.entries(stls).map(([v, u8]) => [v, { name: models[v], b64: bufToB64(u8) }])), ...(S.manualScad != null ? { scad: S.manualScad } : {}) });
  if (!store.set('pipecad-lib', JSON.stringify(lib))) throw new Error('no cabe en el almacenamiento del navegador: usa «Descargar .zip» o el servidor local');
  return lib.custom.length === before;
}
$('#b-save').onclick = async () => {
  const { def } = validate(); if (!def) return;
  if (SRC.catalog?.accesorios?.some(a => a.id === S.id && a.tipo !== 'personalizado')) { alert(`«${S.id}» es un accesorio de serie: usa otro identificador.`); return; }
  let stls; try { stls = await allStls(); } catch (e) { status('✘ No se ha guardado: ' + e.message); return; }
  if (!stls) return;
  try {
    let where, replaced;
    if (SRC.server) { replaced = await saveToServer(stls); where = 'en modelos/personalizados (servidor local)'; }
    else {
      if (!SRC.dir && window.showDirectoryPicker && confirm('Elige a continuación la carpeta «modelos» de PipeCAD para guardar en ella el accesorio.\n\nCancelar = guardarlo solo en este navegador.')) await pickFolder();
      if (SRC.dir) { replaced = await saveToDir(stls); where = `en la carpeta ${SRC.dir.name}/personalizados`; }
      else { replaced = saveToBrowser(stls); where = 'solo en este navegador (con «Descargar .zip» lo llevas a la carpeta modelos)'; }
    }
    dirty = false; notifyPipeCAD(); await loadSources();
    status(`«${S.name || S.id}» ${replaced ? 'actualizado' : 'guardado'} ${where} con ${Object.keys(stls).length} STL de OpenSCAD. Si PipeCAD está abierto, ya lo tiene.`);
  } catch (e) { status('✘ No se ha guardado: ' + e.message); }
};

// ---- .zip con todos los archivos del accesorio (sin compresión: los STL apenas comprimen y así no hace falta ninguna librería)
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 0x21, true); // nombres UTF-8, fecha 1-1-1980
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  }
  const size = central.reduce((n, p) => n + p.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' });
}
$('#b-dl-zip').onclick = async () => {
  const { def } = validate(); if (!def) return;
  let stls; try { stls = await allStls(); } catch (e) { status('✘ ' + e.message); return; }
  if (!stls) return;
  const entry = catalogEntry(stls);
  const leeme = `Accesorio «${S.name || S.id}» (${S.id}) para PipeCAD

Copia el contenido de la carpeta «personalizados» de este .zip en la carpeta modelos/personalizados de PipeCAD
y añade esta entrada a la lista "accesorios" de modelos/catalogo.json:

${JSON.stringify(entry, null, 2)}

También puedes cargarlo desde PipeCAD › Biblioteca › «Cargar accesorio…», eligiendo a la vez el .pcf y los .stl.
Con el servidor local (servidor.mjs) se copian solos a la carpeta modelos.
El .scad necesita ../pipecad.scad (la librería de la carpeta modelos): «Descargar .scad» en el editor da una versión que la lleva dentro.
`;
  const files = [{ name: `personalizados/${S.id}.pcf`, data: pcfText(modelsOf(stls)) }, { name: `personalizados/${S.id}.scad`, data: currentScad() },
    ...Object.entries(stls).map(([v, u8]) => ({ name: `personalizados/${S.id}_${v}.stl`, data: u8 })), { name: 'LEEME.txt', data: leeme }];
  download(`${S.id}.zip`, makeZip(files), 'application/zip');
  status(`${S.id}.zip descargado: ${files.length - 1} archivos y un LEEME.txt con los pasos para añadirlo a la carpeta modelos`);
};

// ---- biblioteca: accesorios de la carpeta modelos y, por compatibilidad, los guardados en el navegador
function browserEntries() {
  let lib; try { lib = JSON.parse(store.get('pipecad-lib') || '{}'); } catch { lib = {}; }
  return (lib.custom || []).map(c => { try { return { def: parsePCF(c.source), scad: c.scad || null }; } catch { return null; } }).filter(Boolean);
}
function renderLibSelect() {
  const folder = (SRC.catalog?.accesorios || []).filter(a => a.tipo === 'personalizado'), nav = browserEntries().filter(e => !folder.some(a => a.id === e.def.id));
  const opts = [...folder.map(a => `<option value="${esc(a.id)}">${esc(a.nombre || a.id)} (${esc(a.id)})</option>`),
    ...nav.map(e => `<option value="${esc(e.def.id)}">${esc(e.def.name)} (${esc(e.def.id)}) · en el navegador</option>`)];
  $('#s-lib').innerHTML = `<option value="">${opts.length ? 'Editar de la biblioteca…' : 'Biblioteca sin accesorios propios'}</option>` + opts.join('');
}
async function editFromLib(id) {
  try {
    const a = SRC.catalog?.accesorios?.find(x => x.id === id && x.tipo === 'personalizado');
    if (a) {
      const def = parsePCF(await readModelFile(a.pcf));
      let code = null;
      if (a.scad) {
        code = (await readModelFile(a.scad)).replace(/\r\n/g, '\n');
        const clr = /^holgura\s*=\s*([\d.]+)\s*;/m.exec(code), fn = /^\$fn\s*=\s*(\d+)\s*;/m.exec(code);
        if (clr) S.clearance = +clr[1];
        if (fn) S.fn = +fn[1];
      }
      loadDef(def);
      if (code != null && code.trim() !== scadText().trim()) { S.manualScad = code; changed(true); } // retocado a mano: se respeta
      dirty = false;
      status(`Editando «${def.name}» de ${a.pcf}` + (S.manualScad != null ? ' (con su código OpenSCAD retocado a mano)' : ''));
      return true;
    }
    const e = browserEntries().find(x => x.def.id === id);
    if (e) { loadDef(e.def, e.scad || null); dirty = false; status(`Editando «${e.def.name}», guardado en este navegador`); return true; }
  } catch (err) { status('✘ No se pudo abrir: ' + err.message.split('\n')[0]); return false; }
  status(`No está «${id}» en la biblioteca de PipeCAD`); return false;
}
const discardOk = () => !dirty || confirm('Hay cambios sin guardar en este accesorio. ¿Descartarlos?');
$('#s-lib').onchange = e => { const id = e.target.value; e.target.value = ''; if (id && discardOk()) editFromLib(id); };
$('#s-template').onchange = e => { const k = e.target.value; e.target.value = ''; if (k && discardOk()) loadTemplate(k); };
$('#b-new').onclick = () => { if (discardOk()) newFitting(); };
$('#b-open').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  const pcf = files.find(f => !/\.scad$/i.test(f.name)), scad = files.find(f => /\.scad$/i.test(f.name));
  try {
    if (pcf) { loadDef(parsePCF(await pcf.text()), scad ? await scad.text() : null); dirty = false; }
    else if (scad) { S.manualScad = await scad.text(); changed(true); }
    status(`Abierto: ${files.map(f => f.name).join(', ')}` + (scad ? ' · el código OpenSCAD abierto se usa tal cual (editado a mano)' : ''));
  } catch (err) { alert('No se pudo abrir:\n\n' + err.message); }
};
addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

/* =====================================================================
   ARRANQUE
   ===================================================================== */
resize(); setPlane('XY');
(async () => {
  await loadSources();
  const params = new URLSearchParams(location.search);
  if (params.get('edit') && await editFromLib(params.get('edit'))) { /* editando */ }
  else if (params.get('plantilla') && await loadTemplate(params.get('plantilla'))) { /* plantilla */ }
  else if (params.has('nuevo') || !(await loadTemplate('cruz90'))) newFitting();
})();
window.pceditor = { S, SRC, parsePCF, pcfText, scadText, standaloneScad, openscad, stlFor, validate, loadTemplate, newFitting, loadSources, makeZip, countPieces }; // para pruebas desde la consola
</script>
