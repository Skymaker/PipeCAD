<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181c">
<title>PipeCAD VR</title>
<style>
:root{
  --bg:#15181c; --panel:#1d2127; --panel-2:#22272e; --border:#323840; --text:#e2e6eb; --muted:#8b95a1;
  --accent:#5b8ff0; --accent-soft:#24324a; --accent-text:#ffffff; --hover:#2a3038; --ok:#4cbf7d; --warn:#e8a33a; --err:#f0616a;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#20252b;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block}
button,select,input{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-height:44px}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);backdrop-filter:blur(6px)}
#top{position:fixed;left:12px;top:12px;padding:8px 12px;max-width:calc(100% - 24px)}
#top b{font-size:15px} #top b span{color:var(--accent)}
#name{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{position:fixed;right:12px;top:12px;display:flex;gap:8px;padding:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 260px)}
#msg{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:14px;padding:8px 14px;font-size:13px;max-width:calc(100% - 24px);text-align:center}
#msg.err{border-color:var(--err);color:var(--err)}
#start{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.35);overflow:auto}
#start .card{padding:20px;max-width:520px;width:100%}
#start h1{font-size:20px;margin:0 0 6px}
#start p{margin:6px 0 12px;color:var(--muted)}
#start .btns{display:grid;gap:8px;grid-template-columns:1fr 1fr}
#start .btns .wide{grid-column:1 / -1}
#start h2{font-size:14px;margin:16px 0 6px;color:var(--muted);font-weight:600}
#sup{font-size:13px;color:var(--muted);margin-top:10px}
#sup b{color:var(--text)}
#clave-row{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
#clave{width:120px;min-height:36px;padding:4px 10px}
#tests{position:fixed;inset:12px;overflow:auto;padding:16px;z-index:5}
#tests h1{font-size:18px;margin:0 0 8px}
#tests li{margin:2px 0;list-style:none} #tests ul{padding:0;margin:0}
#tests .ok{color:var(--ok)} #tests .bad{color:var(--err)} #tests pre{margin:2px 0 6px 18px;color:var(--muted);white-space:pre-wrap;font-size:12px}
@media (max-width:760px){ #bar{left:12px;top:auto;bottom:60px;max-width:none;justify-content:center} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js",
  "troika-three-text": "https://esm.sh/troika-three-text@0.52.4?external=three"
} }
</script>
</head>
<body>
<div id="view" aria-label="Vista 3D del proyecto"></div>
<div id="top" class="card"><b>Pipe<span>CAD</span> VR</b><span id="name">Sin proyecto</span></div>
<div id="bar" class="card" hidden>
  <button id="b-ar" class="primary" disabled title="Diseñar en realidad mixta: la habitación real de fondo">Realidad mixta</button>
  <button id="b-vr" disabled title="Diseñar en realidad virtual: fondo neutro">Realidad virtual</button>
  <button id="b-open" title="Abrir un proyecto .json">Abrir…</button>
  <button id="b-save" title="Guardar el proyecto como archivo .json">Guardar .json</button>
  <button id="b-menu" title="Volver a la pantalla inicial">Inicio</button>
</div>
<div id="msg" class="card" hidden></div>
<div id="start">
  <div class="card">
    <h1>PipeCAD VR</h1>
    <p>Diseña dentro de las gafas: dibuja tubos, coloca accesorios, estira, agrupa y consulta el despiece con las manos o los mandos. En el ordenador, esta página es una vista previa que se maneja con el ratón.</p>
    <div class="btns">
      <button id="s-ar" class="primary" disabled>Entrar en realidad mixta</button>
      <button id="s-vr" disabled>Entrar en realidad virtual</button>
    </div>
    <div id="sup"></div>
    <h2>Proyecto</h2>
    <div class="btns">
      <button id="s-last" hidden>Seguir con el último</button>
      <button id="s-example">Proyecto de ejemplo</button>
      <button id="s-new">Proyecto nuevo</button>
      <button id="s-open">Abrir .json…</button>
      <select id="s-server" class="wide" hidden></select>
    </div>
    <div id="clave-row" hidden><label for="clave">Clave del servidor para guardar desde las gafas:</label><input id="clave" inputmode="numeric" maxlength="8" placeholder="000000"></div>
    <div class="btns" style="margin-top:14px"><button id="s-go" class="wide">Vista previa en esta pantalla</button></div>
  </div>
</div>
<div id="tests" class="card" hidden></div>
<input id="file" type="file" accept=".json,application/json" hidden>

<script src="js/nucleo.js"></script>
<script src="js/xr/entradas.js"></script>
<script src="js/xr/sesion.js"></script>
<script src="js/xr/fisica.js"></script>
<script src="js/xr/escena.js"></script>
<script src="js/xr/texto.js"></script>
<script src="js/xr/paneles.js"></script>
<script src="js/xr/herramientas.js"></script>
<script src="js/xr/pruebas.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   PIPECAD VR — edición del proyecto dentro de las gafas (WebXR, Meta Quest 3)
   El proyecto sigue en mm con Z vertical. El grupo «mundo» aplica la escala (maqueta o tamaño real), el giro y la
   posición; dentro, «proy» pasa de Z vertical a Y vertical. Las herramientas (js/xr/herramientas.js) trabajan en
   coordenadas del proyecto: mano → mundo del proyecto → snap → núcleo. En el ordenador, el ratón hace de rayo.
   ===================================================================== */
const params = new URLSearchParams(location.search);
const hooks = {};
const N = globalThis.crearNucleoPipeCAD(THREE, hooks);
const { Model, fmt, store, loadModels, loadExampleJSON, unpackProject, numStr, nodesBox, DIAMETERS } = N;
const S = globalThis.crearSesionXR, MM = 0.001;
const $ = s => document.querySelector(s);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const leerJSON = (k, def) => { try { return JSON.parse(store.get(k)) ?? def; } catch { return def; } };
const CFG = Object.assign({ diestro: true, sentado: false, panel: 1, texto: 1, contraste: false, vineta: true, giro: 30, puntero: 'auto', cotas: 'real', plano: true, sombra: true }, leerJSON('pipecad-vr-ajustes', {}));
const guardarCFG = () => store.set('pipecad-vr-ajustes', JSON.stringify(CFG));

// ---------------------------------------------------------------- mensajes
let msgTimer = 0;
const TOAST = { texto: '', hasta: 0 };
function aviso(text, ms = 4000) {
  const m = $('#msg'), err = /^✘|^⚠/.test(text); m.textContent = text; m.className = 'card ' + (err ? 'err' : ''); m.hidden = !text;
  clearTimeout(msgTimer); if (text && ms) msgTimer = setTimeout(() => { m.hidden = true; }, ms);
  TOAST.texto = text; TOAST.hasta = performance.now() + ms;
}

// ---------------------------------------------------------------- escena (metros, Y vertical)
const view = $('#view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
view.append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 200);
camera.position.set(0.5, 0.55, 0.75);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0.1, 0);
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9199, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2, 4, 1.5); scene.add(sun);
// Entorno virtual (solo en realidad virtual y en la vista previa): suelo, rejilla de 1 m y horizonte estable
const entorno = new THREE.Group(); scene.add(entorno);
{
  const cielo = new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true, depthWrite: false }));
  const pos = cielo.geometry.attributes.position, cols = [], a = new THREE.Color('#6d8fb8'), b = new THREE.Color('#c9d3de'), c = new THREE.Color('#3b4149'), t = new THREE.Color();
  for (let i = 0; i < pos.count; i++) { const h = pos.getY(i) / 90; (h >= 0 ? t.copy(b).lerp(a, Math.min(1, h * 2.2)) : t.copy(b).lerp(c, Math.min(1, -h * 14))); cols.push(t.r, t.g, t.b); }
  cielo.geometry.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const suelo = new THREE.Mesh(new THREE.CircleGeometry(60, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3b4149, roughness: 1 }));
  suelo.position.y = -0.002;
  const rej = new THREE.GridHelper(40, 40, 0x7b8794, 0x545c66); rej.material.transparent = true; rej.material.opacity = 0.5;
  entorno.add(cielo, suelo, rej); entorno.userData.suelo = suelo;
}
// Mundo del proyecto: escala (maqueta o real), giro alrededor de la vertical y posición
const mundo = new THREE.Group(), proy = new THREE.Group(); proy.rotation.x = -Math.PI / 2; mundo.add(proy); scene.add(mundo);
const W = { modo: 'maqueta', escala: 0.1, yaw: 0, pos: V3() };
const proyQInv = new THREE.Quaternion();
function aplicarMundo() {
  mundo.position.copy(W.pos); mundo.rotation.set(0, W.yaw, 0); mundo.scale.setScalar(W.escala * MM); mundo.updateMatrixWorld(true);
  proy.getWorldQuaternion(proyQInv).invert();
}
aplicarMundo();
const aProy = v => proy.worldToLocal(v.clone());                       // punto del mundo (m) → proyecto (mm)
const dirAProy = v => v.clone().applyQuaternion(proyQInv).normalize(); // dirección del mundo → proyecto
const quatAProy = q => proyQInv.clone().multiply(q);

const ESC = globalThis.crearEscenaXR(THREE, N, { seg: 32, mergeGeometries });
const vista = ESC.crearVista({ seg: 20 }); proy.add(vista.grupo);
const model = new Model();
const sucio = { vista: true, cotas: true, plano: true };
const ed = globalThis.crearEditorVR(THREE, N, model, {
  cambio: live => refrescar(live), estado: t => aviso(t), paso: () => vibraDom(0.25, 12),
  seleccion: () => { sucio.vista = true; kit.refrescar(); },
});
window.pipecadVR = { ed, model, W, CFG, N, THREE }; // para pruebas desde la consola

// ---- vista previa transparente de lo que se está dibujando o colocando
const Y = V3(0, 1, 0);
const prevG = new THREE.Group(); proy.add(prevG);
const fantasma = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false });
const MAT = { ghost: fantasma(0x6ea0ff, 0.5), snap: fantasma(0x3fd07f, 0.6), bad: fantasma(0xe5484d, 0.55), asa: new THREE.MeshBasicMaterial({ color: 0x2f6fde }) };
const GEO = { cyl: new THREE.CylinderGeometry(1, 1, 1, 20, 1, false).translate(0, 0.5, 0), bola: new THREE.SphereGeometry(1, 20, 10) };
const pool = { cyl: [], dot: [], asa: [] };
const linea = (color, n = 2) => { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: n }, () => V3())), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.9, depthTest: false })); l.visible = false; l.renderOrder = 12; l.frustumCulled = false; return l; };
const lineaEje = linea(0xffd166), lineaRegla = linea(0x9cc4ff); prevG.add(lineaEje, lineaRegla);
function usar(lista, i, geo) { let m = lista[i]; if (!m) { m = lista[i] = new THREE.Mesh(geo, MAT.ghost); m.renderOrder = 10; prevG.add(m); } m.visible = true; return m; }
function dibujarPrevia() {
  const pv = ed.previa; let i = 0;
  for (const c of pv.cyls) { const m = usar(pool.cyl, i++, GEO.cyl); m.material = MAT[c.tipo] || MAT.ghost; m.position.copy(c.a); m.quaternion.setFromUnitVectors(Y, c.dir); m.scale.set(c.r, Math.max(c.len, 0.01), c.r); }
  for (; i < pool.cyl.length; i++) pool.cyl[i].visible = false;
  i = 0;
  for (const d of pv.dots) { const m = usar(pool.dot, i++, GEO.bola); m.material = MAT[d.tipo] || MAT.ghost; m.position.copy(d.pos); m.scale.setScalar(d.r); }
  for (; i < pool.dot.length; i++) pool.dot[i].visible = false;
  lineaEje.visible = !!pv.eje;
  if (pv.eje) { const k = 250; lineaEje.geometry.setFromPoints([pv.eje.pos.clone().addScaledVector(pv.eje.dir, -k), pv.eje.pos.clone().addScaledVector(pv.eje.dir, k)]); }
  lineaRegla.visible = !!pv.regla;
  if (pv.regla) { const b = pv.regla.pos.clone(); b[pv.regla.eje] = pv.regla.base; lineaRegla.geometry.setFromPoints([b, pv.regla.pos]); }
}
// ---- puntos de arrastre de la selección y caja del grupo
const cajaGrupo = new THREE.Box3Helper(new THREE.Box3(), 0xffd166); cajaGrupo.visible = false; cajaGrupo.material.depthTest = false; proy.add(cajaGrupo);
function dibujarAsas() {
  const hs = ed.state.tool === 'select' ? ed.handles() : []; let i = 0;
  for (const h of hs) { const m = usar(pool.asa, i++, GEO.bola); m.material = MAT.asa; m.position.copy(h.pos); m.scale.setScalar(h.r); }
  for (; i < pool.asa.length; i++) pool.asa[i].visible = false;
  const st = ed.state, g = st.group && model.groups.get(st.group);
  const ids = g ? g.nodes : st.multi.size > 1 ? [...new Set([...st.multi.values()].flatMap(p => p.type === 'node' ? [p.id] : [model.segments.get(p.id)?.a, model.segments.get(p.id)?.b]))].filter(Boolean) : null;
  cajaGrupo.visible = !!ids?.length;
  if (ids?.length) cajaGrupo.box.copy(nodesBox(model, ids));
}
// ---- plano de trabajo (rejilla de 100 mm) y sombra de contacto
let planoMesh = null, planoKey = '';
const sombra = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, opacity: 0.55 }));
{
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 8, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(0.6, 'rgba(0,0,0,.28)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  sombra.material.map = new THREE.CanvasTexture(c); sombra.renderOrder = 1; proy.add(sombra);
}
function dibujarPlano() {
  const st = ed.state, b = vista.caja(ed.analysis), ax = ed.PLANES[st.wp].axis, off = st.planeOff[st.wp];
  const paso = Math.max(b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z) > 6000 ? 500 : 100, r = x => Math.round(x / paso) * paso;
  const lo = V3(r(b.min.x) - 3 * paso, r(b.min.y) - 3 * paso, r(b.min.z) - 3 * paso), hi = V3(r(b.max.x) + 3 * paso, r(b.max.y) + 3 * paso, r(b.max.z) + 3 * paso);
  const key = [st.wp, off, paso, ...lo.toArray(), ...hi.toArray(), CFG.plano, st.tool].join();
  // sombra de contacto: en la base de la estructura
  sombra.visible = CFG.sombra && ed.analysis.segs.size > 0;
  sombra.position.set((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, b.min.z + 3); sombra.scale.set((b.max.x - b.min.x) * 1.5 + 200, (b.max.y - b.min.y) * 1.5 + 200, 1);
  if (key === planoKey) return; planoKey = key;
  if (planoMesh) { proy.remove(planoMesh); planoMesh.geometry.dispose(); }
  const [u, v] = ['x', 'y', 'z'].filter(k => k !== ax), pts = [], P = (a, b2) => { const p = V3(); p[ax] = off; p[u] = a; p[v] = b2; return p; };
  for (let x = lo[u]; x <= hi[u] + 1; x += paso) pts.push(P(x, lo[v]), P(x, hi[v]));
  for (let y = lo[v]; y <= hi[v] + 1; y += paso) pts.push(P(lo[u], y), P(hi[u], y));
  planoMesh = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x9cc4ff, transparent: true, opacity: 0.28, depthWrite: false }));
  planoMesh.visible = CFG.plano && st.tool !== 'select'; planoMesh.frustumCulled = false; proy.add(planoMesh);
}
// ---- cotas y rótulos en 3D
let troika = null;
try { if (!params.has('sintroika')) troika = await Promise.race([import('troika-three-text'), new Promise((_, no) => setTimeout(() => no(new Error('tiempo agotado')), 6000))]); }
catch (err) { console.warn('troika-three-text no disponible: los rótulos se dibujan con canvas', err.message); }
const TXT = globalThis.crearTextoXR(THREE, troika), rot = TXT.rotulos(90); scene.add(rot.grupo);
let cotas = [], avisosMapa = new Map();
function calcularCotas() {
  const an = ed.analysis, marks = ed.state.cut?.marks; cotas = [];
  if (CFG.cotas === 'no') return;
  for (const g of an.segs.values()) {
    if (g.Le < 1e-6) continue;
    const texto = CFG.cotas === 'real' ? fmt(g.Lr, 0) : CFG.cotas === 'ejes' ? fmt(g.Le, 0) : CFG.cotas === 'ambas' ? `${fmt(g.Lr, 0)} (${fmt(g.Le, 0)})` : marks?.get(g.id) || '—';
    cotas.push({ id: g.id, len: g.Le, p: an.nodes.get(g.a).pos.clone().addScaledVector(g.dir, g.Le / 2), r: g.d / 2, texto, color: g.errors.length ? '#ff8087' : g.warnings.length ? '#ffc766' : '#ffffff', pos: V3() });
  }
}
function refrescar(live) {
  sucio.vista = true; sucio.cotas = true;
  if (live) return;
  avisosMapa = new Map(); for (const i of ed.issues()) { const k = i.pick.type + ':' + i.pick.id; if (avisosMapa.get(k) !== 'err') avisosMapa.set(k, i.cls); }
  sucio.plano = true; kit.refrescar(); autoguardar(); VIVO.enviar();
  $('#name').textContent = model.name || 'Proyecto sin título'; document.title = `${model.name || 'Proyecto'} · PipeCAD VR`;
}
hooks.stlLoaded = () => { sucio.vista = true; };
hooks.modelsChanged = () => { if (model.nodes.size) model.emit(); kit?.refrescar(); };

// ---------------------------------------------------------------- sesión, cabeza y colocación de la maqueta
const SES = globalThis.crearSesionXR(THREE, renderer, { alSalir: () => salioXR() });
const XR = SES.XR;
const enXR = () => renderer.xr.isPresenting;
const camAct = () => (enXR() ? renderer.xr.getCamera() : camera);
const cabeza = () => camAct().getWorldPosition(V3());
const miraXZ = () => { const d = camAct().getWorldDirection(V3()); d.y = 0; return d.lengthSq() < 1e-6 ? V3(0, 0, -1) : d.normalize(); };
let mesa = null; // mesa real detectada cerca (altura), para apoyar la maqueta
// Maqueta: a 50 cm, a la altura de la cintura (o sobre la mesa real si hay una). Tamaño real: sobre el suelo, delante.
function colocar(modo = W.modo, escala) {
  W.modo = modo; W.escala = escala ?? (modo === 'real' ? 1 : modo === 'maqueta' ? 0.1 : W.escala);
  const b = vista.caja(ed.analysis), c = b.getCenter(V3()), medio = Math.max(b.max.x - b.min.x, b.max.y - b.min.y) / 2 * MM * W.escala;
  const cab = cabeza(), dir = miraXZ(), destino = V3();
  if (!enXR()) { W.yaw = 0; destino.set(0, 0, 0); }
  else {
    W.yaw = Math.atan2(-dir.x, -dir.z);
    const suelo = XR.floorY ?? 0;
    if (W.escala >= 0.5) destino.copy(cab).addScaledVector(dir, Math.max(1.2, medio + 0.8)).setY(suelo);
    else {
      let y = cab.y - (CFG.sentado ? 0.32 : 0.45);
      if (mesa && Math.abs(mesa.y - y) < 0.4) y = mesa.y + 0.002;
      destino.copy(cab).addScaledVector(dir, Math.max(0.5, medio + 0.25)).setY(Math.max(suelo, y));
    }
  }
  W.pos.set(0, 0, 0); aplicarMundo();
  W.pos.copy(destino).sub(proy.localToWorld(V3(c.x, c.y, b.min.z))); aplicarMundo();

  const nodo = (i, j, k) => { const key = id(i, j, k); if (!nodos.has(key)) nodos.set(key, m.addNode([i * 400, j * 400, k * 400])); return nodos.get(key); };
  for (let j = 0; j < lado && segs < n; j++) for (let i = 0; i < lado && segs < n; i++) {
    m.addSegment(nodo(i, j, 0), nodo(i, j, 1), 20); segs++;
    if (i + 1 < lado && j % 2 === 0 && segs < n) { m.addSegment(nodo(i, j, 1), nodo(i + 1, j, 1), 20); segs++; }
    if (j + 1 < lado && i % 3 === 0 && segs < n) { m.addSegment(nodo(i, j, 0), nodo(i, j + 1, 0), 20); segs++; }
  }
  return m.toJSON();
}

async function detectar() {
  const s = await SES.detectar(), quest = /OculusBrowser|Quest/i.test(navigator.userAgent);
  for (const id of ['#s-ar', '#b-ar']) $(id).disabled = !s.ar;
  for (const id of ['#s-vr', '#b-vr']) $(id).disabled = !s.vr;
  if (s.vr && !s.ar) { $('#s-vr').classList.add('primary'); $('#s-ar').classList.remove('primary'); }
  $('#sup').innerHTML = s.ar || s.vr ? `<b>${quest ? 'Meta Quest' : 'WebXR'}</b>: ${s.ar ? 'realidad mixta' : ''}${s.ar && s.vr ? ' y ' : ''}${s.vr ? 'realidad virtual' : ''} disponible${s.ar && s.vr ? 's' : ''}.`
    : !isSecureContext ? '<b>Sin WebXR</b>: hace falta abrir la página por HTTPS (o en localhost).' : '<b>Sin gafas en este navegador</b>: abre esta página en el navegador de unas Meta Quest 3. Aquí puedes usar la vista previa con el ratón' + (params.has('emulador') ? '.' : ' o el emulador (<code>vr.html?emulador</code>).');
}

  try {
    await new Promise((ok, no) => { const sc = Object.assign(document.createElement('script'), { src: 'https://cdn.jsdelivr.net/npm/iwer@2.8.0/build/iwer.min.js' }); sc.onload = ok; sc.onerror = () => no(new Error('no se pudo descargar IWER')); document.head.append(sc); });
    const dev = new globalThis.IWER.XRDevice(globalThis.IWER.metaQuest3); dev.installRuntime(); window.pipecadVR.emulador = dev;
    aviso('Emulador IWER (Meta Quest 3) activo: «Entrar en realidad virtual» abre la sesión emulada', 6000);
  } catch (err) { aviso('✘ Emulador: ' + err.message, 8000); }
}
if (params.has('test')) {
  let ejemplo = null; try { ejemplo = await loadExampleJSON(); } catch { /* las pruebas del ejemplo se omiten */ }
  const res = globalThis.pruebasVR(THREE, N, { ejemplo }), mal = res.filter(r => !r.ok).length, el = $('#tests');
  el.hidden = false; $('#start').hidden = true;
  el.innerHTML = `<h1>Pruebas de VR con gestos simulados: ${res.length - mal} de ${res.length} en verde</h1><ul>` + res.map(r => `<li class="${r.ok ? 'ok' : 'bad'}">${r.ok ? (r.skipped ? '–' : '✔') : '✘'} ${N.esc(r.name)}${r.detail ? `<pre>${N.esc(r.detail)}</pre>` : ''}</li>`).join('') + '</ul><p><button onclick="document.querySelector(\'#tests\').hidden=true;document.querySelector(\'#start\').hidden=false">Cerrar</button></p>';
  window.pipecadVR.pruebas = res;
}
detectar();
await SRV.estado(); SRV.listar();
await loadModels().catch(() => null);
{
  const p = /[#&]p=([\w-]+)/.exec(location.hash)?.[1], pid = params.get('proyecto');
  let abierto = false;
  try {
    if (p) { abrirProyecto(await unpackProject(p), { nombre: 'Proyecto compartido' }); abierto = true; }
    else if (params.has('carga')) { abrirProyecto(proyectoCarga(+params.get('carga') || 600)); abierto = true; }
    else if (params.has('ejemplo')) { abrirProyecto(structuredClone(await loadExampleJSON()), { nombre: 'Ejemplo' }); abierto = true; }
    else if (pid && /^[a-z0-9]{6,40}$/.test(pid)) abierto = await SRV.abrir(pid);
  } catch (err) { aviso('✘ No se pudo abrir el proyecto del enlace: ' + err.message, 8000); }
  if (!abierto) {
    const saved = leerJSON('pipecad-autosave', null);
    if (saved?.segments?.length) { try { abrirProyecto(saved); $('#s-last').hidden = false; abierto = true; } catch { /* autoguardado dañado */ } }
  }
  if (!abierto) { try { abrirProyecto(structuredClone(await loadExampleJSON()), { nombre: 'Ejemplo' }); } catch { abrirProyecto(proyectoNuevo()); } }
  if (p || pid || params.has('carga') || params.has('ejemplo')) $('#s-last').hidden = true;
}
Object.assign(window.pipecadVR, { kit, paleta, pProps, pCut, pAvisos, pProy, pAjustes, pAyuda, SES, ENT, SRV, VIVO, GRAV, vista, mundo, proy, colocar, escalaEnSitio, abrirProyecto, puntero, RATON, renderer, scene, camera, entrar, proyectoCarga, get hz() { return hz; } });
